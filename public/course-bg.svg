<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2a4a"/>
      <stop offset="40%" stop-color="#1a4a6a"/>
      <stop offset="75%" stop-color="#2d6e5a"/>
      <stop offset="100%" stop-color="#1a4a30"/>
    </linearGradient>
    <linearGradient id="fairway" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5c30"/>
      <stop offset="100%" stop-color="#0f3a1e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d26a"/>
      <stop offset="100%" stop-color="#e8961a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5d26a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f5d26a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a5580"/>
      <stop offset="100%" stop-color="#0d3352"/>
    </linearGradient>
    <linearGradient id="rough" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c4d28"/>
      <stop offset="100%" stop-color="#122e18"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="900" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="80" cy="60" r="1.2" fill="#fff" opacity="0.6"/>
  <circle cx="160" cy="30" r="0.8" fill="#fff" opacity="0.5"/>
  <circle cx="300" cy="50" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="500" cy="25" r="1.2" fill="#fff" opacity="0.5"/>
  <circle cx="650" cy="55" r="0.9" fill="#fff" opacity="0.6"/>
  <circle cx="720" cy="35" r="1.1" fill="#fff" opacity="0.4"/>
  <circle cx="420" cy="80" r="0.7" fill="#fff" opacity="0.5"/>
  <circle cx="550" cy="70" r="1" fill="#fff" opacity="0.6"/>

  <!-- Sun glow -->
  <ellipse cx="620" cy="210" rx="90" ry="90" fill="url(#glow)"/>

  <!-- Sun -->
  <circle cx="620" cy="210" r="48" fill="url(#sun)" opacity="0.92"/>
  <circle cx="620" cy="210" r="44" fill="#f5d26a" opacity="0.3"/>

  <!-- Sun rays -->
  <g stroke="#f5d26a" stroke-width="2" opacity="0.5">
    <line x1="620" y1="148" x2="620" y2="135"/>
    <line x1="660" y1="158" x2="670" y2="147"/>
    <line x1="680" y1="195" x2="693" y2="190"/>
    <line x1="675" y1="240" x2="688" y2="246"/>
    <line x1="655" y1="272" x2="664" y2="283"/>
    <line x1="620" y1="280" x2="620" y2="293"/>
    <line x1="585" y1="272" x2="576" y2="283"/>
    <line x1="565" y1="240" x2="552" y2="246"/>
    <line x1="560" y1="195" x2="547" y2="190"/>
    <line x1="580" y1="158" x2="570" y2="147"/>
  </g>

  <!-- Distant hills / treeline -->
  <ellipse cx="100" cy="420" rx="180" ry="80" fill="#143d20" opacity="0.8"/>
  <ellipse cx="280" cy="400" rx="150" ry="70" fill="#1a4d28" opacity="0.7"/>
  <ellipse cx="450" cy="415" rx="200" ry="85" fill="#143d20" opacity="0.75"/>
  <ellipse cx="680" cy="395" rx="180" ry="75" fill="#1a4d28" opacity="0.7"/>
  <ellipse cx="800" cy="420" rx="140" ry="70" fill="#143d20" opacity="0.8"/>

  <!-- Water hazard -->
  <ellipse cx="300" cy="560" rx="160" ry="35" fill="url(#water)" opacity="0.85"/>
  <ellipse cx="300" cy="558" rx="155" ry="30" fill="#1e6090" opacity="0.3"/>

  <!-- Fairway -->
  <ellipse cx="400" cy="700" rx="320" ry="200" fill="url(#fairway)" opacity="0.95"/>
  <ellipse cx="400" cy="750" rx="380" ry="220" fill="#1a5c30" opacity="0.5"/>

  <!-- Rough / surround -->
  <rect x="0" y="600" width="800" height="300" fill="url(#rough)" opacity="0.6"/>

  <!-- Green -->
  <ellipse cx="400" cy="630" rx="90" ry="45" fill="#22a855" opacity="0.9"/>
  <ellipse cx="400" cy="628" rx="88" ry="43" fill="#28c860" opacity="0.25"/>

  <!-- Flag -->
  <line x1="400" y1="595" x2="400" y2="560" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
  <polygon points="400,560 422,569 400,578" fill="#c9a84c" opacity="0.95"/>

  <!-- Palm tree LEFT -->
  <g transform="translate(90, 350)">
    <!-- trunk -->
    <path d="M 0,220 C -5,150 -3,80 0,0" stroke="#5c3a1e" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 0,220 C 5,150 3,80 0,0" stroke="#6b4423" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- fronds -->
    <path d="M 0,0 C -60,-30 -90,-15 -110,10" stroke="#1a6b30" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -50,-55 -70,-60 -80,-50" stroke="#1e7a36" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -20,-65 -15,-80 -5,-85" stroke="#228840" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 20,-65 15,-80 5,-85" stroke="#1e7a36" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 50,-55 70,-60 80,-50" stroke="#1a6b30" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 60,-30 90,-15 110,10" stroke="#228840" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 30,-20 60,5 80,20" stroke="#1a6b30" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -30,-20 -60,5 -80,20" stroke="#1e7a36" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- coconuts -->
    <circle cx="-8" cy="5" r="7" fill="#8B6914"/>
    <circle cx="8" cy="8" r="6" fill="#7a5c10"/>
    <circle cx="0" cy="12" r="6" fill="#8B6914"/>
  </g>

  <!-- Palm tree RIGHT -->
  <g transform="translate(680, 330)">
    <path d="M 0,240 C 5,160 4,90 0,0" stroke="#5c3a1e" stroke-width="14" fill="none" stroke-linecap="round"/>
    <path d="M 0,240 C -5,160 -4,90 0,0" stroke="#6b4423" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -60,-25 -90,-10 -110,15" stroke="#1a6b30" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -50,-55 -65,-60 -75,-48" stroke="#1e7a36" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -15,-68 -10,-82 0,-88" stroke="#228840" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 15,-68 10,-82 0,-88" stroke="#1e7a36" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 50,-55 65,-60 75,-48" stroke="#1a6b30" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 60,-25 90,-10 110,15" stroke="#228840" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 30,-15 55,8 75,25" stroke="#1a6b30" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -30,-15 -55,8 -75,25" stroke="#1e7a36" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="8" cy="5" r="7" fill="#8B6914"/>
    <circle cx="-7" cy="9" r="6" fill="#7a5c10"/>
    <circle cx="1" cy="13" r="6" fill="#8B6914"/>
  </g>

  <!-- Small palm background LEFT -->
  <g transform="translate(195, 390)">
    <path d="M 0,160 C -3,100 -2,50 0,0" stroke="#4a2e16" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -40,-20 -60,-10 -70,5" stroke="#1a6b30" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -35,-40 -45,-45 -50,-35" stroke="#1e7a36" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 0,-55 5,-65 5,-60" stroke="#228840" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 35,-40 45,-45 50,-35" stroke="#1a6b30" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 40,-20 60,-10 70,5" stroke="#1e7a36" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Small palm background RIGHT -->
  <g transform="translate(580, 375)">
    <path d="M 0,170 C 3,110 2,55 0,0" stroke="#4a2e16" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -40,-20 -60,-10 -70,5" stroke="#228840" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C -35,-40 -45,-45 -50,-35" stroke="#1a6b30" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 0,-55 5,-65 5,-60" stroke="#1e7a36" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 35,-40 45,-45 50,-35" stroke="#228840" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 0,0 C 40,-20 60,-10 70,5" stroke="#1a6b30" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Cart path -->
  <path d="M 150,900 C 200,800 280,720 360,680 C 440,640 520,650 600,700 C 660,740 710,800 750,900" stroke="#8a7a60" stroke-width="12" fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M 150,900 C 200,800 280,720 360,680 C 440,640 520,650 600,700 C 660,740 710,800 750,900" stroke="#a8956e" stroke-width="6" fill="none" opacity="0.4" stroke-linecap="round"/>

  <!-- Subtle vignette overlay -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
    <stop offset="0%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#050e08" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="800" height="900" fill="url(#vignette)"/>
</svg>
